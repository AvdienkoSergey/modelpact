name: release-please

on:
  push:
    branches:
      - main
  # Lets the release phase be re-run from the Actions tab after a stuck release
  # is unblocked, without an empty commit to main.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT, so the release PR triggers ci.yml: events raised by the
          # default GITHUB_TOKEN start no workflows, and the checks on a release
          # PR would never run. Falls back to the default token when the secret
          # is unset, so this is safe to land before the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
