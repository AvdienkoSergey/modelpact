name: release-please

on:
  push:
    branches:
      - main
  # Lets the release phase be re-run from the Actions tab after a stuck release
  # is unblocked, without an empty commit to main.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT, so the release PR starts ci.yml at all. ci.yml skips its
          # jobs on this branch, but it has to run to skip them: a skipped job
          # reports and satisfies a required check, while a workflow the
          # default GITHUB_TOKEN never triggered leaves that check pending and
          # the PR unmergeable. Falls back to the default token when the secret
          # is unset, so this is safe to land before the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs once per release, on the commit the tag points at. There is no token
  # anywhere: npm is configured to trust this repository and this workflow
  # file, so the runner exchanges its own OIDC identity for a short-lived
  # credential at publish time — which is what `id-token: write` is for.
  #
  # Set up at npmjs.com -> modelpact -> Settings -> Trusted publishing, where
  # the workflow filename is spelled out exactly. Renaming this file stops
  # publishing until that setting is renamed with it.
  #
  # `npm publish` runs `prepublishOnly`, which is the build, so what goes out
  # is built from the tagged tree and nothing else. Provenance is signed on
  # this path automatically, so `--provenance` is not passed for it.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing wants npm >= 11.5.1, and Node 22 still ships 10.x.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --access public
