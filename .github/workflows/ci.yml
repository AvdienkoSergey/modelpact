name: ci

# Pull requests only, which is one run per change and no more. A `push` half
# would check the merge commit a second time, against a tree this already
# tested as `refs/pull/<n>/merge`. What that gives up is the case of two pull
# requests green apart and broken together; "Require branches to be up to date
# before merging" in branch protection closes it, by making the rebase re-run
# this instead.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  # `github.ref` is `refs/pull/<n>/merge`, so one group per pull request and a
  # new push cancels the run it superseded.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A release pull request moves CHANGELOG.md, the version and the manifest,
    # and nothing else — there is no code in it to check. Skipped at job level
    # rather than with `paths-ignore` on purpose: a skipped job still reports,
    # and a required check is satisfied by that, while a workflow that never
    # starts leaves one pending forever.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm ci` over `npm install`: it installs the lockfile exactly and fails
      # if package.json has drifted from it. It runs `prepare`, which is
      # patch-package, which the dom-chromium-ai types depend on.
      - run: npm ci

      # One job rather than three, so the install is paid once. `!cancelled()`
      # keeps the later steps running after an earlier failure — a red run then
      # names every problem instead of only the first.
      - run: npm run typecheck
      - if: ${{ !cancelled() }}
        run: npm run lint
      - if: ${{ !cancelled() }}
        run: npm run format:check
      - if: ${{ !cancelled() }}
        run: npm test
      # What ships is not what the checks above read: the build drops the
      # suites and emits declarations, and only this step compiles that set.
      - if: ${{ !cancelled() }}
        run: npm run build

  # Its own job: installing a browser costs about as much as everything above
  # put together, and keeping it apart lets the fast checks report first.
  e2e:
    # A release pull request moves CHANGELOG.md, the version and the manifest,
    # and nothing else — there is no code in it to check. Skipped at job level
    # rather than with `paths-ignore` on purpose: a skipped job still reports,
    # and a required check is satisfied by that, while a workflow that never
    # starts leaves one pending forever.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The specs drive the demo, which playwright.config.ts boots itself.
      - run: npm ci --prefix demo
      # Chromium only, matching the one project in playwright.config.ts.
      # `--with-deps` pulls the system libraries the runner image lacks.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The same suites again, with a daemon answering. The `check` job runs them
  # with none, and the ollama specs skip there — this job is what makes that
  # skip a fact about the environment rather than a hole.
  ollama:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    env:
      # 708MB, and the smallest thing that still answers in words.
      OLLAMA_MODEL: granite4:350m
      # The daemon's own default is a system path the cache below cannot reach.
      OLLAMA_MODELS: /home/runner/.ollama/models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci --prefix demo
      - run: npx playwright install --with-deps chromium

      - run: curl -fsSL https://ollama.com/install.sh | sh
      # Weights, not the binary: the pull below is a no-op on a hit and the
      # whole download on a miss.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-models-granite4-350m

      - name: Serve, and pull if the cache missed
        run: |
          # The installer starts its own under systemd, with models somewhere
          # this job does not cache — ours replaces it rather than fights it.
          sudo systemctl stop ollama || true
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break
            sleep 1
          done
          ollama pull "$OLLAMA_MODEL"

      - run: npm test
      - if: ${{ !cancelled() }}
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
