# Two ecosystems, one pull request each per week.
#
# `github-actions` is the one that earns its keep: the actions in these
# workflows went four majors stale and only announced themselves as a Node 20
# deprecation warning in a release log. `npm` is devDependencies only — this
# package has no runtime dependencies to update.
#
# The commit prefixes are not cosmetic. release-please reads conventional
# commits, and `build` and `ci` are sections in its config; without these
# prefixes a Dependabot commit would land in the changelog as an unparsed line.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-dependencies:
        patterns: ["*"]
    # The demo and the three packages under external/ have lockfiles of their
    # own and are deliberately not watched: each depends on this package at
    # `file:`, so a bump there reaches no consumer, and what matters about them
    # — that they still compile against the published surface — is checked on
    # every pull request already.
